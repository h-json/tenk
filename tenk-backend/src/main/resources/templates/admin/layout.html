<!DOCTYPE html>
<!--
  관리자 패널 공통 셸. 각 화면은 아래처럼 제목과 본문만 넘긴다:
    <html th:replace="~{admin/layout :: page(~{::title}, ~{::content})}">

  ⚠️ CSS 를 별도 파일로 빼지 않은 건 의도다 — 정적 리소스 경로를 열면 보안 체인에 permitAll 예외를
     하나 더 만들어야 하고, 패널은 화면이 다섯 개뿐이라 그 비용이 이득보다 크다.
  색은 앱의 디자인 토큰(민트 #1FBE9C / 잉크 #1C1D21)과 같은 값을 쓴다 — 같은 서비스로 읽히게.
-->
<html lang="ko" th:fragment="page(title, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:replace="${title}">TenK 관리자</title>
    <style>
        :root {
            --mint: #1FBE9C; --mint-tint: #E3F6F0;
            --ink: #1C1D21; --ink-sub: #5A5F6B; --ink-muted: #9AA1AE;
            --line: #EAECEF; --surface-alt: #F1F3F6;
            --danger: #FF6B6B; --warn: #E0951B;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #fff; color: var(--ink);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        }
        a { color: var(--mint); text-decoration: none; }
        a:hover { text-decoration: underline; }

        header.top {
            display: flex; align-items: center; gap: 24px;
            padding: 0 24px; border-bottom: 1px solid var(--line); background: #fff;
            position: sticky; top: 0; z-index: 10;
        }
        .brand { font-weight: 800; font-size: 18px; color: var(--ink); padding: 16px 0; }
        .brand span { color: var(--mint); }
        nav.menu { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
        nav.menu a {
            padding: 16px 12px; color: var(--ink-sub); font-weight: 600; font-size: 14px;
            border-bottom: 2px solid transparent;
        }
        nav.menu a:hover { text-decoration: none; color: var(--ink); }
        nav.menu a.on { color: var(--mint); border-bottom-color: var(--mint); }
        .logout button {
            background: none; border: 1px solid var(--line); border-radius: 8px;
            padding: 6px 12px; font-size: 13px; color: var(--ink-sub); cursor: pointer;
        }

        main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .sub { color: var(--ink-muted); font-size: 13px; margin: 0 0 24px; }

        .flash {
            background: var(--mint-tint); color: #0E7A63; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 20px; font-size: 14px; font-weight: 600;
        }
        .note-box {
            background: var(--surface-alt); border-radius: 10px; padding: 12px 16px;
            font-size: 13px; color: var(--ink-sub); margin-bottom: 20px;
        }
        .note-box strong { color: var(--warn); }

        .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
        .card {
            flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
        }
        .card .label { font-size: 13px; color: var(--ink-muted); }
        .card .value { font-size: 30px; font-weight: 800; margin-top: 4px; }
        .card.alert { border-color: var(--mint); background: var(--mint-tint); }
        .card.alert .value { color: #0E7A63; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { font-size: 12px; color: var(--ink-muted); font-weight: 700; white-space: nowrap; }
        tr:hover td { background: #FAFBFC; }
        td.num { color: var(--ink-muted); white-space: nowrap; }
        .empty { padding: 48px 0; text-align: center; color: var(--ink-muted); }

        .pill {
            display: inline-block; padding: 3px 9px; border-radius: 999px;
            font-size: 12px; font-weight: 700; white-space: nowrap;
        }
        .pill.pending { background: #FDF1DC; color: var(--warn); }
        .pill.done { background: var(--surface-alt); color: var(--ink-muted); }
        .pill.tester { background: var(--mint-tint); color: #0E7A63; }
        .pill.deleted { background: #FFE8E8; color: #C0392B; }

        .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filters a {
            padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
            font-size: 13px; font-weight: 600; color: var(--ink-sub);
        }
        .filters a:hover { text-decoration: none; }
        .filters a.on { background: var(--ink); color: #fff; border-color: var(--ink); }

        input[type=text], input[type=email], input[type=password], textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--line);
            border-radius: 10px; background: var(--surface-alt); font: inherit; color: var(--ink);
        }
        input:focus, textarea:focus { outline: 2px solid var(--mint); background: #fff; }
        textarea { resize: vertical; min-height: 76px; }
        label.field { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
        .field-row { margin-bottom: 16px; }

        button.primary, .btn {
            background: var(--mint); color: #fff; border: none; border-radius: 10px;
            padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
        }
        button.ghost {
            background: #fff; color: var(--ink-sub); border: 1px solid var(--line);
            border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
        }
        button.small { padding: 5px 12px; font-size: 13px; border-radius: 8px; }

        .content-block {
            white-space: pre-wrap; word-break: break-word; background: var(--surface-alt);
            border-radius: 12px; padding: 16px; margin: 0;
            font: inherit;
        }
        dl.meta { display: grid; grid-template-columns: 96px 1fr; gap: 8px 16px; margin: 0 0 24px; font-size: 14px; }
        dl.meta dt { color: var(--ink-muted); font-size: 13px; }
        dl.meta dd { margin: 0; word-break: break-all; }

        .pager { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 24px; font-size: 14px; }
        .pager .disabled { color: var(--ink-muted); }
    </style>
</head>
<body>
<header class="top">
    <div class="brand">Ten<span>K</span> 관리자</div>
    <nav class="menu">
        <a th:href="@{/admin}" th:classappend="${menu == 'dashboard'} ? 'on'">대시보드</a>
        <a th:href="@{/admin/inquiries}" th:classappend="${menu == 'inquiries'} ? 'on'">문의</a>
        <a th:href="@{/admin/feedbacks}" th:classappend="${menu == 'feedbacks'} ? 'on'">의견</a>
        <a th:href="@{/admin/users}" th:classappend="${menu == 'users'} ? 'on'">사용자</a>
        <a th:href="@{/admin/app-config}" th:classappend="${menu == 'app-config'} ? 'on'">앱 버전</a>
    </nav>
    <form class="logout" th:action="@{/admin/logout}" method="post">
        <button type="submit">로그아웃</button>
    </form>
</header>
<main th:replace="${content}"></main>
</body>
</html>
