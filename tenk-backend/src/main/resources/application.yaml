spring:
  application:
    name: tenk

  profiles:
    active: local

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    # ⚠️ show-sql / format_sql / hibernate 로그 레벨은 **application-local.yaml 에만** 둔다.
    # 여기(공통)에 두면 prod 에도 적용돼 JPA 를 지나는 모든 값(닉네임·문의 본문·회신 이메일·
    # 생년월일·관리자 비밀번호 해시)이 컨테이너 로그로 나간다 — 로그가 수집표·보관기간
    # 어디에도 안 잡히는 개인정보 보관소가 된다. 규칙은 CLAUDE.md "로그 위생".

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

tenk:
  upload:
    base-dir: ${TENK_UPLOAD_DIR:./uploads}
  # 이용자 접속기록(TENK_ACCESS_LOG)과 애플리케이션 오류 로그가 쌓이는 곳. logback-spring.xml 이
  # 이 값을 읽어 **일 단위 × 90(3개월)** 롤링 보관한다 — 개인정보처리방침 §3 에 고지한 기간이다.
  # ⚠️ 관리자 접속기록(tenk.admin.audit-log-dir, 13개월)과 **다른 스트림**이니 값을 맞추지 말 것.
  # 배포에서는 컨테이너 볼륨(/app/app-logs)으로 덮어써 재배포에도 기록이 살아남는다.
  log:
    dir: ${TENK_LOG_DIR:./logs}
  # 관리자 패널(/admin/**). 기본 꺼짐 — 켜는 곳은 각 프로파일이다.
  # 꺼져 있으면 보안 체인이 등록되지 않아 /admin/** 이 앱 체인의 anyRequest().authenticated()
  # 에 걸려 401 로 끊긴다(컨트롤러까지 가지 않음).
  # ⚠️ account 는 **yaml 이 진실의 원천**이라 부팅할 때마다 계정을 만들거나 비밀번호를 다시 맞춘다
  #    (AdminAccountInitializer). 그래서 패널에 비밀번호 변경 화면이 없다 — 바꾸려면 여기를 고치고 재시작.
  admin:
    enabled: false
    # 관리자 접속기록(TENK_ADMIN_AUDIT)이 쌓이는 곳. logback-spring.xml 이 이 값을 읽어
    # 별도 파일에 1년(13개월) 롤링 보관한다 — 개인정보처리방침 §8 에 고지한 기간이다.
    # 배포에서는 컨테이너 볼륨(/app/logs)으로 덮어써 재배포에도 기록이 살아남는다.
    audit-log-dir: ./logs
  # 관리자(개발자) 알림. 기본은 꺼짐 — local/test 에서 실제 메일·텔레그램이 나가면 안 되고,
  # 자격증명은 prod 프로파일에만 둔다 (jwt secret 과 같은 원칙: 공통 fallback 을 두지 않는다).
  # 켜는 곳은 application-prod.yaml 한 곳뿐.
  notify:
    mail:
      enabled: false
    telegram:
      enabled: false
  auth:
    jwt:
      # secret은 환경별 profile(application-{local,prod}.yaml)에서 박는다.
      # 여기에 공통 fallback을 두면 prod에서 dev 키가 그대로 새어나갈 수 있어 의도적으로 비워둠.
      # 부팅 시 secret이 없으면 JwtTokenProvider 초기화 단계에서 즉시 실패함.
      access-token-ttl: PT1H
      refresh-token-ttl: P14D
      issuer: tenk
    kakao:
      # 카카오 디벨로퍼스 → 내 앱 → 요약 정보의 "앱 ID" (숫자). REST API/네이티브/JS 키와 다른 값.
      # access_token_info 응답의 app_id 필드와 일치 검증해서 다른 앱 토큰을 차단한다.
      # 네이티브 앱 키(영숫자)는 Flutter 측 KakaoSdk.init에서만 사용한다.
      app-id: 1459747

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# logging.level 은 공통에 두지 않는다 — 위 jpa 주석과 같은 이유.
# 개발용 SQL/파라미터 로깅은 application-local.yaml 에 있다.
