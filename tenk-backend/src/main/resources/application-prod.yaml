# TODO: prod 환경 구축 시 채울 것
# 실행: java -jar tenk.jar --spring.profiles.active=prod
spring:
  datasource:
    url: jdbc:mariadb://TODO_PROD_HOST:3306/tenk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: TODO_PROD_USER
    password: TODO_PROD_PASSWORD
  # 관리자 알림 발송용 SMTP (Gmail). password 는 계정 비밀번호가 아니라 **앱 비밀번호**다
  # (2단계 인증을 켜야 발급된다). host 가 없으면 JavaMailSender 빈 자체가 자동 구성되지 않으므로
  # local/test 에는 이 블록을 두지 않는다 — AdminNotifier 가 빈 부재를 견디게 돼 있다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: system.tenk@gmail.com
    password: hdlm eoav ehvq timd
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 외부 지연이 알림 스레드를 오래 잡지 않게 짧게 끊는다 (알림은 늦느니 포기하는 편이 낫다).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Traefik 리버스 프록시 뒤에 있으므로 X-Forwarded-* 헤더(특히 Proto=https)를 신뢰한다.
# 없으면 springdoc/Swagger 가 내부 요청 스킴(http)으로 서버 URL을 만들어 mixed content →
# HTTPS 페이지가 "주의 요함" 으로 표시된다. prod 전용(로컬은 프록시 없음).
server:
  forward-headers-strategy: framework

tenk:
  auth:
    jwt:
      # `openssl rand -base64 64`로 생성한 512bit HS256 키. 평문 의미 없는 완전 랜덤.
      # 키 노출/유출 시: 이 값을 새 키로 교체하면 기존에 발급된 모든 AT/RT가 즉시 무효화됨.
      # private 레포 전제이므로 yaml에 직접 박아 두지만, 리포가 공개로 전환되거나 외부에 새어나가면 즉시 회전(rotate) 필요.
      secret: WVzjLgcdqToIfIflBfiETuAyrzq1D4N0jjEhe+P1IHnAyKGib5khOKw4kHwBoKLRCPO3N78931f3hJdjRAZgUA==

  # 문의·의견 도착 알림 + 미처리 문의 리마인드. 두 갈래로 보내는 건 한쪽을 놓쳐도 다른 쪽이 남기
  # 때문이고, 그래도 놓칠 수 있어서 미처리 문의는 매일 오전 9시에 다시 알린다(InquiryScheduler).
  # 발송 실패는 로그만 남기고 저장은 그대로 성공한다 (AdminNotifier — best-effort).
  notify:
    mail:
      enabled: true
      # 발신은 system.tenk@(spring.mail.username), 수신은 support.tenk@ 로 나뉜다.
      to: support.tenk@gmail.com
    telegram:
      enabled: true
      # BotFather 가 발급한 HTTP API 토큰 (봇 @tenk_system_bot).
      bot-token: 8601313406:AAGIJZXs25sPkduJRw-Zpq9vr3WqxNh_Nuk
      # 알림을 받을 대화 id. 봇에게 먼저 말을 걸어야 생기며, 아래로 확인한다:
      #   https://api.telegram.org/bot<TOKEN>/getUpdates  →  result[].message.chat.id
      chat-id: 8946220822
