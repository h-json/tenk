# 실행: java -jar tenk.jar --spring.profiles.active=prod
spring:
  datasource:
    url: jdbc:mariadb://TODO_PROD_HOST:3306/tenk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: TODO_PROD_USER
    password: TODO_PROD_PASSWORD
  # 관리자 알림 발송용 SMTP (Gmail). password 는 계정 비밀번호가 아니라 **앱 비밀번호**다
  # (2단계 인증을 켜야 발급된다). host 가 없으면 JavaMailSender 빈 자체가 자동 구성되지 않으므로
  # local/test 에는 이 블록을 두지 않는다 — AdminNotifier 가 빈 부재를 견디게 돼 있다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: system.tenk@gmail.com
    password: hdlm eoav ehvq timd
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 외부 지연이 알림 스레드를 오래 잡지 않게 짧게 끊는다 (알림은 늦느니 포기하는 편이 낫다).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Traefik 리버스 프록시 뒤에 있으므로 X-Forwarded-* 헤더(특히 Proto=https)를 신뢰한다.
# 없으면 springdoc/Swagger 가 내부 요청 스킴(http)으로 서버 URL을 만들어 mixed content →
# HTTPS 페이지가 "주의 요함" 으로 표시된다. prod 전용(로컬은 프록시 없음).
server:
  forward-headers-strategy: framework
  servlet:
    session:
      # 관리자 패널 세션. 공개 인터넷에 로그인 폼이 노출돼 있으므로 오래 열어두지 않는다.
      timeout: 2h
      cookie:
        http-only: true
        secure: true      # HTTPS 전용 (Traefik 뒤)
        same-site: lax    # 폼 POST 는 same-origin 이라 lax 로 충분하고 CSRF 방어가 한 겹 는다

tenk:
  auth:
    jwt:
      # `openssl rand -base64 64`로 생성한 512bit HS256 키. 평문 의미 없는 완전 랜덤.
      # 키 노출/유출 시: 이 값을 새 키로 교체하면 기존에 발급된 모든 AT/RT가 즉시 무효화됨.
      # private 레포 전제이므로 yaml에 직접 박아 두지만, 리포가 공개로 전환되거나 외부에 새어나가면 즉시 회전(rotate) 필요.
      secret: WVzjLgcdqToIfIflBfiETuAyrzq1D4N0jjEhe+P1IHnAyKGib5khOKw4kHwBoKLRCPO3N78931f3hJdjRAZgUA==

  # 관리자 패널 (https://tenk.hjson248.com/admin). 문의 처리 · 의견 열람 · TESTER 승격 ·
  # 앱 버전 정책을 여기서 한다 — 예전의 SSH + docker exec mariadb + SQL 의례를 대체한다.
  # ⚠️ 공개 인터넷에 로그인 폼이 노출된다. 자격증명은 여기서만 바꾸고(재시작 시 DB 해시 동기화),
  #    유출되면 즉시 이 값을 교체 후 재시작할 것 — jwt secret 과 같은 운영 방식이다.
  # email 은 **순수 로그인 ID** 다 — 메일이 오가지 않고 형식 검증도 없다. 개인 메일을 쓰지 말 것
  # (ID 를 추측당하면 비밀번호 하나만 남는다). 서비스 전용 3계정의 역할 구분은 CLAUDE.md "관리자 알림" 참고:
  #   system.tenk@ = 알림 발신 / support.tenk@ = 수신·고지된 문의처 / admin.tenk@ = 패널 로그인
  admin:
    enabled: true
    account:
      email: admin.tenk@gmail.com
      password: EzaF$=G5Qw2g01~RS
    # 알림 본문에 붙일 패널 주소. 서버는 자기 공개 주소를 모르고 알림은 스케줄러(요청 밖)에서도
    # 나가므로 설정으로 받는다. 비우면 링크 줄만 빠지고 알림 자체는 정상 발송된다.
    base-url: https://tenk.hjson248.com

  # 문의·의견 도착 알림 + 미처리 문의 리마인드. 두 갈래로 보내는 건 한쪽을 놓쳐도 다른 쪽이 남기
  # 때문이고, 그래도 놓칠 수 있어서 미처리 문의는 매일 저녁 6시에 다시 알린다(InquiryScheduler).
  # 알림은 "왔다/남았다"는 신호만 담는다 — 본문은 관리자 패널에서 본다.
