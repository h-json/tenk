      # 발신은 system.tenk@(spring.mail.username), 수신은 support.tenk@ 로 나뉜다.
      to: support.tenk@gmail.com
    telegram:
      enabled: true
      # BotFather 가 발급한 HTTP API 토큰 (봇 @tenk_system_bot).
      bot-token: 8601313406:AAGIJZXs25sPkduJRw-Zpq9vr3WqxNh_Nuk
