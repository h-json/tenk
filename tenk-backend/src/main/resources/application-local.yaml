spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/tenk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: tenk
    password: gmlwns12!@

  # 개발용 SQL 로깅. **로컬 전용이고 공통(application.yaml)으로 올리지 말 것** —
  # bind:trace 는 JPA 를 지나는 모든 값을 찍으므로 prod 에서는 개인정보가 통째로 로그에 남는다.
  # (실제로 그 상태였고 2026-08-17 에 여기로 내렸다. CLAUDE.md "로그 위생" 참고.)
  # show-sql 은 logback 을 안 거치고 stdout 에 직접 쓰므로 로그 레벨만 내려선 안 꺼진다 — 넷이 한 세트.
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

tenk:
  auth:
    jwt:
      # 로컬 개발 전용 HS256 키 (Base64, 256bit 이상). prod에서는 절대 사용 금지.
      secret: dGVuay1sb2NhbC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtMTIzNDU2Nzg=

  # 로컬에서 패널을 열어볼 수 있게 켜둔다. 접속: http://localhost:8080/admin
  # **로그인 ID 는 prod 와 같은 값, 비밀번호는 로컬 전용**이다 (2026-08-07 결정).
  #   - ID 를 맞추는 건 로컬에서 확인한 로그인이 곧 운영에서 쓸 로그인이라 "로컬에선 되는데" 가
  #     안 생기게 하려는 것 (prod 값을 바꾸면 여기도 같이 바꾼다).
  #   - ⚠️ 비밀번호까지 맞추지 않는 건 **로컬 백엔드가 0.0.0.0:8080 에 열리기 때문**이다 —
  #     같은 Wi-Fi 의 누구나 이 폼에 접근할 수 있어, 값을 공유하면 카페 같은 공용망에 운영
  #     자격증명을 들고 나가는 셈이 된다. 여기 값은 외우기 쉬운 로컬 전용으로 둘 것.
  # 값을 바꾸고 재시작하면 admin_user 해시가 자동으로 다시 맞춰진다 (AdminAccountInitializer).
  admin:
    enabled: true
    account:
      email: admin.tenk@gmail.com
      password: gmlwns12!@
    base-url: http://localhost:8080
